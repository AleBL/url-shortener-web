<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curto | Encurte qualquer link em segundos</title>
    <!-- Static tags stay in Portuguese: search engines and link previews do
         not run the script that switches the language. -->
    <meta
      name="description"
      content="Cole o endereço, aperte Enter e copie o link curto. Sem cadastro."
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#fafafa"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#09090b"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Curto" />
    <meta
      property="og:title"
      content="Curto | Encurte qualquer link em segundos"
    />
    <meta
      property="og:description"
      content="Cole o endereço, aperte Enter e copie o link curto. Sem cadastro."
    />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
